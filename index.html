:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mut:#777;--line:#d9d4c7;--acc:#2f6f5e;--chip:#e8efe9;--room:#ece7da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif;padding:12px}
h1{font-size:20px;margin:0 0 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.pool{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px;min-height:60px}
.pool h2,.tb h2{font-size:13px;margin:0 0 6px;color:var(--mut);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:28px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:3px 8px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;font-size:12px}
.chip.drag{opacity:.35}
.ghost{position:fixed;pointer-events:none;z-index:99;background:var(--acc);color:#fff;border-radius:14px;padding:5px 10px;box-shadow:0 4px 12px #0004;transform:translate(-50%,-120%)}
.room{position:relative;width:100%;overflow:auto;background:#fff;border:2px solid var(--line);border-radius:12px}

.tb{position:absolute;background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:5px;z-index:2;display:flex;flex-direction:column;box-shadow:0 2px 8px #0003}
.tb .chips{flex:1;overflow:auto;align-content:flex-start}
.rz{position:absolute;right:0;bottom:0;width:20px;height:20px;touch-action:none;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--acc) 50%);border-radius:0 0 12px 0}
.hd{display:flex;align-items:center;gap:6px;margin-bottom:6px;touch-action:none;cursor:move}
.hd .g{color:var(--mut);font-size:14px;padding:0 4px;user-select:none}
.hd input{flex:1;min-width:0;font:600 12px system-ui;background:transparent;color:var(--ink);border:0;border-bottom:1px dashed var(--line)}

.ob .lb{font:600 12px system-ui;text-align:center;outline:none;padding:2px;max-width:100%;overflow-wrap:anywhere}
.ob .lb:focus{background:#fff9;border-radius:4px;cursor:text}
.ob .x{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:#444;color:#fff;text-align:center;line-height:20px;font-size:14px;padding:0;z-index:3}

</style></head><body>
<h1>Sitzplan</h1>
<div class="bar"><button class="p" id="rnd">Zufällig verteilen</button><button id="clr">Alle zurück in die Liste</button><button id="rst">Tische ordnen</button><button id="zo">Zoom −</button><button id="zi">Zoom +</button></div>
<div class="hint">Namen mit Finger/Maus ziehen: auf einen Tisch = platzieren, auf einen anderen Namen = tauschen. Tische am ☰ verschieben, am Dreieck unten rechts größer/kleiner ziehen. Mit „+“ weitere Tische/Objekte hinzufügen, × löscht. Objekte: antippen = umbenennen.</div>
<div class="bar" id="addbar"></div>
<div class="pool" id="pool"><h2>Noch nicht platziert</h2><div class="chips"></div></div>
<div class="room" id="room"><div class="sz" id="sz"><div class="inner" id="inner"></div></div></div>
<script>
const NAMES="Jasper,Sabine,Hannes,Dorian,Helge,Carina,Fenja,Insa,Emi,Martina,Eckhard,Gerda,Nicolas,Michael,Hans-Joerg,Laura,Katrin,Sina,Ute,Dirk,Irmtrud,Vanessa,Lukas,Florian,Maja,Johann,Nina,Lukas,Kristina,Hannes,Henning,Fabian,Sara,Dario,Yvonne,Kristian,Mareile,Lisa,Lukas,Jessica,Maria,Lucas,Frederike,Jasper,Karina".split(",");
const POS=[[250,190],[430,190],[610,190],[430,380]];let K=1,Z=1;
let S;
function fresh(){return{t:POS.map((p,i)=>({id:i,n:"Tisch "+(i+1),x:p[0],y:p[1],w:150,h:120})),p:NAMES.map((n,i)=>({id:i,n,t:null}))}}
try{S=JSON.parse(localStorage.getItem("sitzplan2"))}catch(e){}
if(S&&S.t)S.t.forEach(t=>{if(t.type!=="obj"&&t.w===230&&t.h===200){t.w=150;t.h=120}});
if(!S||!S.p||S.p.length!==45||!Array.isArray(S.t))S=fresh();
function save(){try{localStorage.setItem("sitzplan2",JSON.stringify(S))}catch(e){}}
function chip(p){const c=document.createElement("div");c.className="chip";c.textContent=p.n;c.dataset.id=p.id;c.onpointerdown=e=>dragChip(e,c,p);return c}
function render(){
  const pc=document.querySelector("#pool .chips");pc.innerHTML="";
  S.p.filter(p=>p.t===null).forEach(p=>pc.appendChild(chip(p)));
  const inn=document.getElementById("inner");inn.innerHTML="";
  S.t.forEach(t=>{
    const ob=t.type==="obj";
    const d=document.createElement("div");d.className=ob?"ob":"tb";d.dataset.t=t.id;
    d.style.left=t.x+"px";d.style.top=t.y+"px";d.style.width=t.w+"px";d.style.height=t.h+"px";
    const x=document.createElement("span");x.className="x";x.textContent="×";x.onpointerdown=e=>e.stopPropagation();
    x.onclick=()=>{S.p.forEach(p=>{if(p.t===t.id)p.t=null});S.t=S.t.filter(q=>q!==t);save();render()};
    const rz=document.createElement("div");rz.className="rz";rz.onpointerdown=e=>resize(e,d,t);
    if(ob){
      d.style.background=t.c+"cc";if(t.r)d.style.borderRadius="50%";
      const lb=document.createElement("div");lb.className="lb";lb.contentEditable="true";lb.textContent=t.n;
      lb.oninput=()=>{t.n=lb.textContent;save()};lb.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();lb.blur()}};
      lb.onpointerdown=e=>{if(document.activeElement===lb)e.stopPropagation()};
      d.onpointerdown=e=>dragTable(e,d,t);
      d.append(lb,x,rz);
    }else{
      const hd=document.createElement("div");hd.className="hd";
      hd.innerHTML='<span class="g">☰</span><input value=""><span class="cnt"></span>';
      const inp=hd.querySelector("input");inp.value=t.n;inp.onchange=()=>{t.n=inp.value;save()};
      inp.onpointerdown=e=>e.stopPropagation();
      hd.querySelector(".cnt").textContent=S.p.filter(p=>p.t===t.id).length;
      hd.appendChild(x);hd.onpointerdown=e=>dragTable(e,d,t);
      const cs=document.createElement("div");cs.className="chips";
      S.p.filter(p=>p.t===t.id).forEach(p=>cs.appendChild(chip(p)));
      d.append(hd,cs,rz);
    }
    inn.appendChild(d)});
}
function dragTable(e,d,t){
  e.preventDefault();let moved=false;const ox=e.clientX/K-t.x,oy=e.clientY/K-t.y,sx=e.clientX,sy=e.clientY;
  const mv=ev=>{if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>4)moved=true;
    t.x=Math.max(0,Math.min(1040-t.w,ev.clientX/K-ox));t.y=Math.max(0,Math.min(640-t.h,ev.clientY/K-oy));d.style.left=t.x+"px";d.style.top=t.y+"px"};
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);save();
    if(!moved&&t.type==="obj"){const l=d.querySelector(".lb");if(l)l.focus()}};
  addEventListener("pointermove",mv);addEventListener("pointerup",up)}
function resize(e,d,t){
  e.preventDefault();e.stopPropagation();const sx=e.clientX,sy=e.clientY,w0=t.w,h0=t.h,mn=t.type==="obj"?40:80;
  const mv=ev=>{t.w=Math.max(mn,Math.min(1040,w0+(ev.clientX-sx)/K));t.h=Math.max(mn,Math.min(640,h0+(ev.clientY-sy)/K));
    if(t.x+t.w>1040)t.x=1040-t.w;if(t.y+t.h>640)t.y=640-t.h;
    d.style.left=t.x+"px";d.style.top=t.y+"px";d.style.width=t.w+"px";d.style.height=t.h+"px"};
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);save()};
  addEventListener("pointermove",mv);addEventListener("pointerup",up)}
function fit(){const w=document.getElementById("room").clientWidth-4;K=Math.max(.45,Math.min(1.3,w/1040))*Z;
  inner.style.transform="scale("+K+")";sz.style.width=1040*K+"px";sz.style.height=640*K+"px"}
zi.onclick=()=>{Z=Math.min(2.5,Z*1.2);fit()};zo.onclick=()=>{Z=Math.max(.5,Z/1.2);fit()};addEventListener("resize",fit);
function target(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return{};
  const c=el.closest(".chip:not(.drag)"),t=el.closest(".tb"),po=el.closest("#pool");
  return{c,t,po}}
function dragChip(e,c,p){
  e.preventDefault();let moved=false,last=null;
  const g=document.createElement("div");g.className="ghost";g.textContent=p.n;
  const mv=ev=>{
    if(!moved){moved=true;c.classList.add("drag");document.body.appendChild(g)}
    g.style.left=ev.clientX+"px";g.style.top=ev.clientY+"px";
    if(last)last.classList.remove("over");
    const r=target(ev.clientX,ev.clientY);last=r.c||r.t||r.po||null;if(last)last.classList.add("over");
    if(ev.clientY<30)scrollBy(0,-10);if(ev.clientY>innerHeight-30)scrollBy(0,10)};
  const up=ev=>{
    removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
    g.remove();if(last)last.classList.remove("over");
    if(!moved)return;
    const r=target(ev.clientX,ev.clientY);
    if(r.c){const q=S.p.find(x=>x.id==r.c.dataset.id);[p.t,q.t]=[q.t,p.t]}
    else if(r.t)p.t=+r.t.dataset.t;
    else if(r.po)p.t=null;
    save();render()};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up)}
rnd.onclick=()=>{const a=S.p.map(p=>p);for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}a.forEach((p,i)=>p.t=i%4);save();render()};
clr.onclick=()=>{S.p.forEach(p=>p.t=null);save();render()};
rst.onclick=()=>{S.t.filter(t=>t.type!=="obj").forEach((t,i)=>{const q=POS[i%4];t.x=q[0];t.y=q[1];t.w=150;t.h=120});save();render()};
const TY={"Tisch":{w:150,h:120},"Stehtisch":{type:"obj",w:60,h:60,c:"#f4d58d",r:1},"Geschenketisch":{type:"obj",w:120,h:60,c:"#f2b5d4"},"Tanzfläche":{type:"obj",w:240,h:170,c:"#c9b6f0"},"Eigenes Objekt":{type:"obj",w:100,h:70,c:"#d0d0d0"}};
Object.keys(TY).forEach(k=>{const b=document.createElement("button");b.textContent="+ "+k;
  b.onclick=()=>{const id=Math.max(-1,...S.t.map(t=>t.id))+1,ty=TY[k],o=ty.type==="obj";
    S.t.push(Object.assign({id,n:o?(k==="Eigenes Objekt"?"Objekt":k):"Tisch "+(S.t.filter(t=>t.type!=="obj").length+1),x:380+(id%6)*20,y:280+(id%6)*20},ty));save();render()};
  document.getElementById("addbar").appendChild(b)});
render();fit();
